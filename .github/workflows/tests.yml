name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run unit tests
        run: mvn -B verify
      - name: Upload coverage reports
        if: matrix.java == 17 && always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: '*/target/site/jacoco/'

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install modules
        run: mvn -B install -DskipTests
      - name: Run end-to-end suite against an embedded server
        run: mvn -B verify -Ptest -pl Tests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            Tests/target/failsafe-reports/
            Tests/target/site/jacoco-it/
